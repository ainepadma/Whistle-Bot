<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江海小鹞 · Banyao Desktop Pets</title>
    <link rel="stylesheet" href="../media/reset.css">
    <link rel="stylesheet" href="../media/pets.css">
    <style>
        @font-face {
            font-family: 'silkscreen';
            src: url('../media/Silkscreen-Regular.ttf') format('truetype');
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* 画布与背景层不拦截鼠标，点击穿透检测只认宠物碰撞区 */
        #ballCanvas,
        #foregroundEffectCanvas,
        #backgroundEffectCanvas,
        #foreground,
        #background,
        #petsContainer {
            pointer-events: none;
        }

        .collision,
        .bubble {
            pointer-events: auto;
        }

        /* 首次启动提示 */
        #desktopHint {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 1000;
            max-width: 320px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(15, 18, 26, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #d7dee8;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 12px;
            line-height: 1.7;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            pointer-events: auto;
            transition: opacity 0.6s ease;
        }

        #desktopHint b {
            color: #ffd479;
        }

        #desktopHint.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* 打字速度指示器（悬停/点击宠物时可见的调试与反馈） */
        #typingIndicator {
            position: fixed;
            left: 14px;
            top: 14px;
            z-index: 2000;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(15, 18, 26, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #d7dee8;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 12px;
            line-height: 1;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #typingIndicator.hide {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div id="petCanvasContainer">
        <canvas id="ballCanvas"></canvas>
        <canvas id="foregroundEffectCanvas"></canvas>
        <canvas id="backgroundEffectCanvas"></canvas>
    </div>
    <div id="petsContainer"></div>
    <div id="foreground"></div>
    <div id="background"></div>

    <div id="desktopHint">
        <b>江海小鹞</b><br>
        悬停/点击宠物会与它互动；<b>托盘图标</b>可隐藏或退出，<b>Ctrl+Alt+P</b> 可重新打开宠物。
    </div>

    <div id="typingIndicator" class="hide">⌨️ <span id="typingSpeedText">0.0</span></div>

    <script src="../media/main-bundle.js"></script>
    <script src="glue.js"></script>
</body>

</html>
