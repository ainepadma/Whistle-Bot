<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江海小鹞 · Banyao Desktop Pets</title>
    <link rel="stylesheet" href="../media/reset.css">
    <link rel="stylesheet" href="../media/pets.css">
    <style>
        @font-face {
            font-family: 'silkscreen';
            src: url('../media/Silkscreen-Regular.ttf') format('truetype');
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* 画布与背景层不拦截鼠标，点击穿透检测只认宠物碰撞区 */
        #ballCanvas,
        #foregroundEffectCanvas,
        #backgroundEffectCanvas,
        #foreground,
        #background,
        #petsContainer {
            pointer-events: none;
        }

        .collision,
        .bubble {
            pointer-events: auto;
        }

        /* 首次启动提示 */
        #desktopHint {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 1000;
            max-width: 320px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(15, 18, 26, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #d7dee8;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 12px;
            line-height: 1.7;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            pointer-events: auto;
            transition: opacity 0.6s ease;
        }

        #desktopHint b {
            color: #ffd479;
        }

        #desktopHint.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* 右上角控制条：菜单 / 隐藏 / 退出 */
        #petControlBar {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 2000;
            display: flex;
            gap: 6px;
            padding: 6px;
            border-radius: 12px;
            background: rgba(15, 18, 26, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            opacity: 0.78;
            transition: opacity 0.2s ease;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        #petControlBar:hover {
            opacity: 1;
        }

        #petControlBar button {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #d7dee8;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #petControlBar button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #petControlBar button.quit:hover {
            background: rgba(239, 83, 80, 0.4);
            color: #ffffff;
        }

        /* 小窗口模式下，控制条可作为窗口拖动把手 */
        body.mode-small #petControlBar {
            -webkit-app-region: drag;
        }

        #petControlBar button {
            -webkit-app-region: no-drag;
        }

        /* 打字速度指示器（悬停/点击宠物时可见的调试与反馈） */
        #typingIndicator {
            position: fixed;
            left: 14px;
            top: 14px;
            z-index: 2000;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(15, 18, 26, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #d7dee8;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 12px;
            line-height: 1;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #typingIndicator.hide {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div id="petCanvasContainer">
        <canvas id="ballCanvas"></canvas>
        <canvas id="foregroundEffectCanvas"></canvas>
        <canvas id="backgroundEffectCanvas"></canvas>
    </div>
    <div id="petsContainer"></div>
    <div id="foreground"></div>
    <div id="background"></div>

    <div id="desktopHint">
        <b>江海小鹞</b><br>
        悬停/点击宠物会与它互动；<b>右上角控制条</b>可隐藏或退出，<b>Ctrl+Alt+P</b> 可重新打开宠物。<br>
        小窗口模式下可拖动控制条移动窗口位置。
    </div>

    <div id="petControlBar" title="宠物控制条">
        <button id="btnPetMenu" title="菜单：添加宠物 / 主题 / 大小">⚙️</button>
        <button id="btnPetHide" title="隐藏宠物（托盘图标或 Ctrl+Alt+P 重新打开）">🙈</button>
        <button id="btnPetQuit" class="quit" title="退出应用">✖️</button>
    </div>

    <div id="typingIndicator" class="hide">⌨️ <span id="typingSpeedText">0.0</span></div>

    <script src="../media/main-bundle.js"></script>
    <script src="glue.js"></script>
</body>

</html>
