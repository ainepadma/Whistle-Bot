<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <title>九连星板鹞彩绘蒙面</title>
  <desc>九组正方形与四十五度正方形叠合，中央青龙金云，八方红底龙纹与神将。平涂简化原模型彩绘，星面之间留空，不含竹骨及哨口。</desc>
  <!-- Geometry and medallion arrangement follow Banyao Kites/blender/nine_linked_star.
       Local star tip radius is 100. Small/large scales retain the exact sqrt(2) ratio.
       The nine independent silhouettes meet only at tips; inter-star gaps stay transparent. -->
  <defs>
    <path id="star" d="M100 0 70.71067811865476 29.28932188134525 70.71067811865476 70.71067811865476 29.28932188134525 70.71067811865476 0 100-29.28932188134525 70.71067811865476-70.71067811865476 70.71067811865476-70.71067811865476 29.28932188134525-100 0-70.71067811865476-29.28932188134525-70.71067811865476-70.71067811865476-29.28932188134525-70.71067811865476 0-100 29.28932188134525-70.71067811865476 70.71067811865476-70.71067811865476 70.71067811865476-29.28932188134525Z"/>
    <clipPath id="starClip"><use href="#star"/></clipPath>
    <clipPath id="discClip"><circle r="64.4"/></clipPath>
    <g id="tipCloud" fill="#63927a" stroke="#d7b778" stroke-width=".9" stroke-linejoin="round">
      <path d="M81.2 0Q80.8-3.3 83.5-3.3Q85-6.2 87.1-3.4Q91-3.2 90.9 0Q91 3.2 87.1 3.4Q85 6.2 83.5 3.3Q80.8 3.3 81.2 0Z"/>
      <path d="M83.7 0Q86.1-2.3 88.4 0Q86.1 2.3 83.7 0Z" fill="none" stroke-width=".7"/>
    </g>
    <g id="starBase" clip-path="url(#starClip)">
      <use href="#star" fill="#212920"/>
      <path d="M69.438 28.709 28.709 69.438H-28.709L-69.438 28.709V-28.709L-28.709-69.438H28.709L69.438-28.709Z" fill="#eddbb6"/>
      <circle r="64.4" fill="#be402a"/>
      <circle r="65.7" stroke="#b79a64" stroke-width=".8"/>
      <use href="#tipCloud"/><use href="#tipCloud" transform="rotate(45)"/>
      <use href="#tipCloud" transform="rotate(90)"/><use href="#tipCloud" transform="rotate(135)"/>
      <use href="#tipCloud" transform="rotate(180)"/><use href="#tipCloud" transform="rotate(225)"/>
      <use href="#tipCloud" transform="rotate(270)"/><use href="#tipCloud" transform="rotate(315)"/>
      <use href="#star" stroke="#c55235" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g id="ribbons" stroke="#eddaad" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
