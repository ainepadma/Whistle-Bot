    <g id="swordGuardian">
      <use href="#guardian"/>
      <path d="M-38 8 14-49 20-46-28 17Z" fill="#e0dfb8" stroke="#927b46" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M-36 3-25 15M-37 12-42 19" stroke="#d0ae5f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="dragonDisc" clip-path="url(#discClip)">
      <use href="#ribbons"/>
      <use href="#dragon"/>
    </g>
    <g id="guardianDisc" clip-path="url(#discClip)">
      <use href="#ribbons"/>
      <use href="#guardian"/>
    </g>
    <g id="swordDisc" clip-path="url(#discClip)">
      <use href="#ribbons"/>
      <use href="#swordGuardian"/>
    </g>
  </defs>
  <!-- Image atlas positions match the original front: diagonals carry dragons,
       cardinal faces carry guardians, and the central painting carries gold clouds. -->
  <g id="center" transform="translate(500 500) scale(2.071067811865475)">
    <use href="#starBase"/>
    <g clip-path="url(#discClip)"><use href="#goldClouds"/><use href="#dragon" transform="rotate(-14)"/></g>
  </g>
  <g id="east" transform="translate(853.5533905932738 500) scale(1.4644660940672624)" color="#467763">
    <use href="#starBase"/><use href="#guardianDisc"/>
  </g>
  <g id="northeast" transform="translate(750 250) scale(1.4644660940672624)">
    <use href="#starBase"/><use href="#dragonDisc" transform="rotate(24)"/>
  </g>
  <g id="north" transform="translate(500 146.44660940672624) scale(1.4644660940672624)" color="#b49340">
    <use href="#starBase"/><use href="#swordDisc"/>
  </g>
  <g id="northwest" transform="translate(250 250) scale(1.4644660940672624)">
    <use href="#starBase"/><use href="#dragonDisc" transform="rotate(-18)"/>
  </g>
  <g id="west" transform="translate(146.44660940672624 500) scale(1.4644660940672624)" color="#5a8770">
    <use href="#starBase"/><use href="#swordDisc"/>
  </g>
  <g id="southwest" transform="translate(250 750) scale(1.4644660940672624)">
