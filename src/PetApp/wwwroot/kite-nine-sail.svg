      <path d="M-11 23 13 23M-10 28 12 28M-5 21-4 31M4 21 4 32" stroke="#e1c478" stroke-width="1.2"/>
      <path d="M37-54 33 56" stroke="#d3b466" stroke-width="3.4"/>
      <path d="M38-61 44-48 36-38 31-48Z" fill="#dfc47d"/>
