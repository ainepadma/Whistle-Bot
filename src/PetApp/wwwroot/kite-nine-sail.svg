      <path d="M32-56Q22-43 43-37Q59-32 47-17Q36-4 52 7Q64 17 47 30Q36 36 44 46"/>
      <path d="M-34 49Q-26 59-15 50Q-3 41 10 53Q25 63 36 48"/>
    </g>
    <g id="goldClouds" fill="#d4ad49" stroke="#ad8236" stroke-width="1.2" stroke-linejoin="round">
      <path d="M-61-4Q-67-20-52-27Q-53-42-37-43Q-39-56-22-59Q-16-66-8-58Q8-64 12-47Q22-37 12-24Q-8-31-14-13Q-30-17-34 0Q-48-7-61-4Z"/>
      <path d="M37-44Q53-43 52-28Q68-16 60-3Q67 11 54 18Q51 33 34 29Q22 43 10 34Q12 15 23 6Q15-9 30-19Q25-32 37-44Z"/>
