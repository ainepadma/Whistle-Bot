      <path d="M-47-18-54-18M-39-33-42-40M49 18 55 15M42 30 48 34M-38 35-45 35M-25 49-27 55" stroke="#e1c382" stroke-width="2"/>
      <path d="M6-51Q18-57 30-49L31-38 20-26 3-31-7-42Z" fill="#73a18a" stroke="#2d5949" stroke-width="2"/>
      <path d="M6-47-1-53-6-49M22-50 24-61 31-56M-1-35-14-31-7-24 8-30M21-30 26-23 33-28" fill="#d9c58b" stroke="#95824b" stroke-width="1.6"/>
      <path d="M5-39 17-42 17-36 6-34Z" fill="#eddfb4" stroke="#3d513a" stroke-width="1"/>
